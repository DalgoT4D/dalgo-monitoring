name: dalgo-prod-targets

services:
  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"

  process_exporter:
    image: ncabatoff/process-exporter:0.8.7
    container_name: process_exporter
    restart: unless-stopped
    privileged: true
    command:
      - '--procfs=/host/proc'
      - '--config.path=/config/process-exporter.yml'
    volumes:
      - '/proc:/host/proc:ro'
      - ./process-exporter.yml:/config/process-exporter.yml:ro
    ports:
      - "9256:9256"

  celery_exporter:
    image: danihodovic/celery-exporter:0.10.10
    container_name: celery_exporter
    restart: unless-stopped
    network_mode: host
    environment:
      CE_BROKER_URL: ${CELERY_BROKER_URL}
      CE_ACCEPT_CONTENT: json

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '--housekeeping_interval=15s'
      - '--docker_only=true'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    ports:
      - "9280:8080"
