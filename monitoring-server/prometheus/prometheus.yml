global:
  scrape_interval: 15s
  external_labels:
    monitor: 'prometheus'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['prod-ec2:9100']
        labels:
          instance: 'dalgo-production-ec2'

  - job_name: 'process_exporter'
    static_configs:
      - targets: ['prod-ec2:9256']
        labels:
          instance: 'dalgo-production-ec2'

  - job_name: 'celery_exporter'
    static_configs:
      - targets: ['prod-ec2:9808']
        labels:
          instance: 'dalgo-production-ec2'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['prod-ec2:9280']
        labels:
          instance: 'dalgo-production-ec2'

  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']
        labels:
          instance: 'dalgo-prod-rds'

  - job_name: 'ddp_backend'
    scrape_timeout: 9s
    scheme: https
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ['api.dalgo.org']

  # Uptime probes via blackbox_exporter.
  # To add a URL: copy a `- targets: [...] / labels: ...` block.
  - job_name: 'blackbox_http'
    scrape_interval: 30s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [https://insights.dalgo.org]
        labels:
          instance: dalgo-production
          env: production
          subset: dalgo
      - targets: [https://api.dalgo.org/healthcheck]
        labels:
          instance: dalgo-api
          env: production
          subset: dalgo
      - targets: [https://staging-app.dalgo.org]
        labels:
          instance: dalgo-staging
          env: staging
          subset: dalgo
      - targets: [https://vaultwarden.projecttech4dev.org/alive]
        labels:
          instance: vaultwarden
          env: production
          subset: tech4dev
      # Superset instances (per-client) — probing /health (lightweight, returns 200 directly)
      - targets: [https://akrsp.dalgo.org/health]
        labels:
          instance: akrsp
          env: production
          subset: superset
      - targets: [https://atecf.dalgo.org/health]
        labels:
          instance: atecf
          env: production
          subset: superset
      - targets: [https://bhumi.dalgo.org/health]
        labels:
          instance: bhumi
          env: production
          subset: superset
      - targets: [https://goonj.dalgo.org/health]
        labels:
          instance: goonj
          env: production
          subset: superset
      - targets: [https://inrem.dalgo.org/health]
        labels:
          instance: inrem
          env: production
          subset: superset
      - targets: [https://janaagraha.dalgo.org/health]
        labels:
          instance: janaagraha
          env: production
          subset: superset
      - targets: [https://mad.dalgo.org/health]
        labels:
          instance: mad
          env: production
          subset: superset
      - targets: [https://noora.dalgo.org/health]
        labels:
          instance: noora
          env: production
          subset: superset
      - targets: [https://shofco.dalgo.org/health]
        labels:
          instance: shofco
          env: production
          subset: superset
      - targets: [https://sneha.dalgo.org/health]
        labels:
          instance: sneha
          env: production
          subset: superset
      - targets: [https://stir.dalgo.org/health]
        labels:
          instance: stir
          env: production
          subset: superset
      - targets: [https://superset.dalgo.org/health]
        labels:
          instance: dalgo-internal
          env: production
          subset: superset
      - targets: [https://moonshine.projecttech4dev.org/health]
        labels:
          instance: moonshine
          env: production
          subset: superset
      - targets: [https://ummeed.dalgo.org/health]
        labels:
          instance: ummeed
          env: production
          subset: superset
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox_exporter:9115
