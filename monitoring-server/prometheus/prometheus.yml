global:
  scrape_interval: 15s
  external_labels:
    monitor: 'prometheus'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['prod-ec2:9100']
        labels:
          instance: 'ddp-production-arm'

  - job_name: 'process_exporter'
    static_configs:
      - targets: ['prod-ec2:9256']
        labels:
          instance: 'ddp-production-arm'

  - job_name: 'celery_exporter'
    static_configs:
      - targets: ['prod-ec2:9808']
        labels:
          instance: 'ddp-production-arm'

  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']
        labels:
          instance: 'dalgo-prod-rds'

  - job_name: 'ddp_backend'
    scrape_timeout: 9s
    scheme: https
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ['api.dalgo.org']
